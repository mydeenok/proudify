<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certificate Template — Navy &amp; Gold Wave</title>
<style>
  :root {
    --navy-dark: #0d2647;
    --navy: #14315c;
    --gold-light: #f9dd8b;
    --gold: #d8a83d;
    --gold-dark: #b9861f;
    --ink: #2b2b2b;
    --muted: #4a4a4a;
    --paper: #fdfaf5;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @page { size: A4 landscape; margin: 0; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #e9ecf1;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }

  .certificate {
    position: relative;
    width: 100%;
    height: 100%;
    aspect-ratio: 1.414 / 1;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }

  .certificate svg.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* ---- Header ---- */
  .org-row {
    position: absolute;
    top: 46px;
    left: 55px;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 320px;
    height: 44px;
  }

  .org-row img {
    height: 40px;
    width: auto;
    max-width: 120px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .org-name {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1.2;
    max-width: 180px;
    white-space: normal;
    word-break: break-word;
  }

  .title-block {
    position: absolute;
    top: 40px;
    right: 55px;
    width: 420px;
    text-align: right;
  }

  .cert-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--ink);
    max-width: 420px;
    white-space: normal;
    word-break: break-word;
  }

  /* ---- Body ---- */
  .presented-label {
    position: absolute;
    top: 210px;
    left: 55px;
    right: 55px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .recipient-name {
    position: absolute;
    top: 300px;
    left: 55px;
    width: 520px;
    font-family: 'Brush Script MT', 'Segoe Script', cursive;
    font-size: 40px;
    font-weight: 400;
    line-height: 1.15;
    color: var(--navy);
    white-space: normal;
    word-break: break-word;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 6px;
  }

  .cert-description {
    position: absolute;
    top: 390px;
    left: 55px;
    width: 520px;
    max-height: 62px;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.45;
    color: var(--muted);
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
  }

  /* ---- Footer row: fixed height ---- */
  .footer {
    position: absolute;
    bottom: 72px;
    left: 55px;
    width: 560px;
    height: 100px;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .footer-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    height: 100px;
    flex-shrink: 0;
  }

  .footer-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 6px;
    white-space: nowrap;
  }

  .sig-block {
    width: 168px;
  }

  .sig-line {
    width: 140px;
    height: 1px;
    background: var(--ink);
    margin-bottom: 4px;
  }

  .sig-block img {
    width: 140px;
    height: 50px;
    object-fit: contain;
    object-position: left center;
    display: block;
  }

  .date-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.2;
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- QR: bottom-right navy corner, clear of medal ---- */
  .qr-panel {
    position: absolute;
    bottom: 36px;
    right: 44px;
    width: 108px;
    height: 118px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    z-index: 2;
  }

  .qr-box {
    width: 82px;
    height: 82px;
    background: #ffffff;
    border: 2px solid var(--gold);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    box-shadow: 0 3px 10px rgba(13, 38, 71, 0.28);
    flex-shrink: 0;
  }

  .qr-box img {
    width: 68px;
    height: 68px;
    object-fit: contain;
    display: block;
  }

  .qr-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffffff;
    margin-top: 8px;
    text-align: center;
    white-space: nowrap;
    width: 108px;
    line-height: 1;
  }

  /* ---- Credential ID: absolute, never inline ---- */
  .credential-id {
    position: absolute;
    bottom: 22px;
    left: 55px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: #8a8a8a;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="certificate">
  <svg class="bg" viewBox="0 0 1000 707" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="goldStripe" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f9dd8b"/>
        <stop offset="50%" stop-color="#d8a83d"/>
        <stop offset="100%" stop-color="#b9861f"/>
      </linearGradient>
      <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0d2647"/>
        <stop offset="100%" stop-color="#14315c"/>
      </linearGradient>
      <radialGradient id="medalGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#f9dd8b"/>
        <stop offset="55%" stop-color="#d8a83d"/>
        <stop offset="100%" stop-color="#b9861f"/>
      </radialGradient>
      <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#d8a83d"/>
        <stop offset="100%" stop-color="#b9861f"/>
      </linearGradient>
    </defs>

    <path d="M0,0 L0,205 C 190,275 300,95 430,120 C 520,138 560,60 560,0 Z" fill="url(#navyGrad)"/>
    <path d="M0,205 C 190,275 300,95 430,120 C 520,138 560,60 560,0" fill="none" stroke="url(#goldStripe)" stroke-width="12" stroke-linecap="round"/>

    <path d="M1000,707 L1000,500 C 850,440 760,650 620,610 C 540,588 500,650 500,707 Z" fill="url(#navyGrad)"/>
    <path d="M1000,500 C 850,440 760,650 620,610 C 540,588 500,650 500,707" fill="none" stroke="url(#goldStripe)" stroke-width="12" stroke-linecap="round"/>

    <!-- medal moved mid-right so QR sits cleanly in bottom-right navy corner -->
    <g transform="translate(910, 310) scale(0.82)">
      <path fill="url(#ribbonGrad)" d="M-38,55 L-14,150 L-2,120 L14,150 L38,55 Z"/>
      <path fill="url(#medalGrad)" stroke="#fff" stroke-width="2" d="M0,-72 L11,-40 L44,-52 L34,-19 L68,-13 L46,14 L72,36 L38,42 L46,76 L14,60 L0,92 L-14,60 L-46,76 L-38,42 L-72,36 L-46,14 L-68,-13 L-34,-19 L-44,-52 L-11,-40 Z"/>
    </g>
  </svg>

  <div class="org-row">
    <img src="{company_logo}" alt="Logo">
    <span class="org-name">{organization_name}</span>
  </div>

  <div class="title-block">
    <h1 class="cert-title">{title}</h1>
  </div>

  <p class="presented-label">Presented To</p>

  <h2 class="recipient-name">{recipient_name}</h2>

  <p class="cert-description">{description}</p>

  <div class="footer">
    <div class="footer-block sig-block">
      <span class="footer-label">Authorized Signature</span>
      <div class="sig-line"></div>
      <img src="{signature}" alt="Signature">
    </div>
    <div class="footer-block">
      <span class="footer-label">Date Issued</span>
      <span class="date-value">{date_of_issue}</span>
    </div>
  </div>

  <div class="qr-panel">
    <div class="qr-box">
      <img src="{qrcode}" alt="QR Code">
    </div>
    <span class="qr-label">Scan to Verify</span>
  </div>

  <p class="credential-id">Credential ID: {verification_code}</p>
</div>

</body>
</html>
